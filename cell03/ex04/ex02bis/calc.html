<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            padding: 30px;
        }
        input,
        select,
        button {
            font-size: 16px;
            padding: 5px 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <input type="text" id="left" placeholder="Left number">

    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
    </select>

    <input type="text" id="right" placeholder="Right number">

    <button id="tryBtn">Try me!</button>

    <script>
        const $leftInput = $("#left");
        const $rightInput = $("#right");
        const $operatorSelect = $("#operator");
        const $tryBtn = $("#tryBtn");

        function isPositiveInteger(value) {
            return /^\d+$/.test(value);
        }

        $tryBtn.on("click", function () {
            const left = $leftInput.val();
            const right = $rightInput.val();
            const operator = $operatorSelect.val();

            if (!isPositiveInteger(left) || !isPositiveInteger(right)) {
                alert("Error :(");
                return;
            }

            const l = Number(left);
            const r = Number(right);
            let result;

            if ((operator === "/" || operator === "%") && r === 0) {
                alert("It's over 9000!");
                console.log("It's over 9000!");
                return;
            }

            switch (operator) {
                case "+":
                    result = l + r;
                    break;
                case "-":
                    result = l - r;
                    break;
                case "*":
                    result = l * r;
                    break;
                case "/":
                    result = l / r;
                    break;
                case "%":
                    result = l % r;
                    break;
            }

            alert(result);
            console.log(result);
        });

        function remindAlert() {
            alert("Please, use me...");
            setTimeout(remindAlert, 30000);
        }

        setTimeout(remindAlert, 30000);
    </script>

</body>
</html>
