<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            text-align: center;
        }
        .title {
            color: white;
            font-size: 50px;
        }
        .images {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 40px;
        }
        .shop {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        img {
            height: 100px;
        }
        hr {
            width: 100%;
        }
        .footer {
            font-style: italic;
            font-family: monospace;
            text-align: right;
        }
    </style>
</head>

<body>

    <h1 class="title">$OnlineShops</h1>

    <div class="images">
        <div class="shop">
            <img src="https://cdn2.downdetector.com/static/uploads/logo/shopee.png">
            <a href="https://shopee.co.th/">Shopee</a>
        </div>
        <div class="shop">
            <img src="https://img.lazcdn.com/g/tps/images/ims-web/TB1KB2laMFY.1VjSZFnXXcFHXXa.png">
            <a href="https://www.lazada.co.th/">Lazada</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        © rbunchoo 2026
    </div>

</body>

</html>
