<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,body {
            margin: 0;
            height: 100%;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            border: 1px solid black;
            vertical-align: middle;
        }
        .first-cell {
            background-color: rgb(134, 156, 54);
        }
        .sec-cell {
            background-color: rgb(218, 177, 142);
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="sec-cell">Second cell</td>
        </tr>
    </table>
</body>
